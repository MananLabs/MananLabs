name: Profile visuals

'on':
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main, master]
    paths:
      - .github/workflows/profile-visuals.yml
      - scripts/generate_github_dashboard.py
      - scripts/normalize_snake.py

permissions:
  contents: read

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'MananLabs/MananLabs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh real GitHub dashboard
        id: dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_github_dashboard.py --username MananLabs
      - name: Generate snake from MananLabs contributions
        id: snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MananLabs
          outputs: |
            snake-output/contribution-snake.svg?palette=github-dark&color_snake=%2361dcec&color_dots=%23111b24,%23184735,%232b8056,%2343bc7e,%235cf8a4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare mobile-sized snake
        if: steps.snake.outcome == 'success'
        run: python scripts/normalize_snake.py snake-output/contribution-snake.svg assets/contribution-snake.svg
      - uses: actions/upload-artifact@v4
        with:
          name: profile-visuals
          path: |
            assets/dashboard/
            assets/contribution-snake.svg
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: profile-visuals
          path: assets
      - name: Publish only generated profile visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard/ assets/contribution-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update GitHub profile visuals'
            git push
          fi
